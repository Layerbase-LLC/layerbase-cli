name: Version Check

on:
  pull_request:
    branches: [main]

jobs:
  check-version:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Get PR version
        id: pr_version
        env:
          SEMVER_LIB: ${{ runner.temp }}/semver-lib/node_modules/semver
        run: |
          # The version comes from the PR: treat it as untrusted data.
          npm install --prefix "$RUNNER_TEMP/semver-lib" --no-save --no-package-lock --ignore-scripts --silent semver@7.6.3
          node -e '
            const semver = require(process.env.SEMVER_LIB)
            const fs = require("fs")
            const v = JSON.parse(fs.readFileSync("package.json", "utf8")).version
            if (typeof v !== "string" || /[\r\n]/.test(v) || semver.valid(v) !== v) {
              console.error("::error::package.json version must be a single-line semver version")
              process.exit(1)
            }
            if (semver.prerelease(v)) {
              console.error("::error::package.json version must be a release version: publish.yml does not publish prereleases")
              process.exit(1)
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${v}\n`)
          '

      - name: Get npm version
        id: npm_version
        run: |
          NPM_VERSION=$(npm view layerbase version 2>/dev/null || echo "0.0.0")
          echo "version=$NPM_VERSION" >> $GITHUB_OUTPUT

      - name: Compare versions
        id: compare
        env:
          PR_VERSION: ${{ steps.pr_version.outputs.version }}
          NPM_VERSION: ${{ steps.npm_version.outputs.version }}
          SEMVER_LIB: ${{ runner.temp }}/semver-lib/node_modules/semver
        run: |
          echo "PR version: $PR_VERSION"
          echo "npm version: $NPM_VERSION"

          node -e '
            const semver = require(process.env.SEMVER_LIB)
            const pr = process.env.PR_VERSION
            const npm = semver.valid(process.env.NPM_VERSION) ? process.env.NPM_VERSION : "0.0.0"
            const result = semver.gt(pr, npm) ? "greater" : semver.eq(pr, npm) ? "equal" : "lesser"
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `result=${result}\n`)
          '

      - name: Comment on PR if version not bumped
        if: steps.compare.outputs.result != 'greater'
        uses: actions/github-script@v7
        env:
          PR_VERSION: ${{ steps.pr_version.outputs.version }}
          NPM_VERSION: ${{ steps.npm_version.outputs.version }}
        with:
          script: |
            const prVersion = process.env.PR_VERSION;
            const npmVersion = process.env.NPM_VERSION;

            const [major, minor, patch] = npmVersion.split('.').map(Number);
            const patchBump = `${major}.${minor}.${patch + 1}`;
            const minorBump = `${major}.${minor + 1}.0`;
            const majorBump = `${major + 1}.0.0`;

            const body = [
              '## Version Check Failed',
              '',
              '| Current npm | This PR |',
              '|-------------|---------|',
              `| \`${npmVersion}\` | \`${prVersion}\` |`,
              '',
              `Please bump the version in \`package.json\` to be greater than \`${npmVersion}\` before merging.`,
              '',
              '**Examples:**',
              `- Patch: \`${patchBump}\``,
              `- Minor: \`${minorBump}\``,
              `- Major: \`${majorBump}\``,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Version Check Failed')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if version not bumped
        if: steps.compare.outputs.result != 'greater'
        run: |
          echo "Version must be incremented before merging"
          exit 1

      - name: Success
        if: steps.compare.outputs.result == 'greater'
        env:
          PR_VERSION: ${{ steps.pr_version.outputs.version }}
          NPM_VERSION: ${{ steps.npm_version.outputs.version }}
        run: |
          echo "Version check passed: $NPM_VERSION -> $PR_VERSION"
